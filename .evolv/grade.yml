# Exa grading manifest: the SAME manifest drives local Run Tests AND the
# server-side grader (parity). Schema: everything under 'test:'; 'setup'
# installs deps so the grader's env matches the local venv.
#
# `image` makes the block run in a container, so local Run Tests and grading
# use the same interpreter and pinned deps. Dependencies are baked into the
# image (see Dockerfile), so `setup` is a cache hit and grading works offline.
#
# The command never runs test/setup_lab.py, which would reset the learner's
# work. test/conftest.py turns every skipped check (the lab was never set up)
# into a failure, and a run with no checks exits non-zero, so an untouched
# project never passes.
test:
  image: "evolv/python-3.12"
  setup: ["pip install -r requirements.txt"]
  command: "python -m pytest -q --junitxml=reports/out.xml"
  reports: "reports/*.xml"
